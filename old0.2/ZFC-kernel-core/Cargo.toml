[workspace]
resolver = "2"
members = ["kapi", "core", "drivers/usb", "drivers/net", "drivers/storage", "fs"]
[workspace.package]
version = "0.1.0"
edition = "2021"
[workspace.dependencies]
spin = "0.9"
bitflags = "2.4"
log = "0.4"
smoltcp = { version = "0.11", default-features = false, features = ["proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp", "socket-dns", "medium-ethernet"] }
[profile.release]